<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"/>
<title>Ground Operations · Offline</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green-1: #05CE78;
    --green-2: #00AB61;
    --navy:    #140D8A;
    --champagne: #F9F0E9;
    --margin: 10vmin;
    --ease-out:    cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--champagne);
  }

  /* ─── Background system ─────────────────────────────────────────
     Only transform + opacity are animated — GPU only, no repaint.
     Each blob has a unique duration so they never perfectly sync,
     creating an organic, breathing feel.
  ──────────────────────────────────────────────────────────────── */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    /* Warm champagne base with a subtle cool-to-warm gradient */
    background: radial-gradient(ellipse 80% 80% at 70% 20%, #e6f7ef 0%, #F9F0E9 55%, #fdf4ee 100%);
  }

  /* Noise grain — adds texture so the blobs don't look flat */
  .grain {
    position: fixed;
    inset: -50%;
    z-index: 1;
    pointer-events: none;
    opacity: 0.04;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode: multiply;
  }

  /* Blobs: large, heavily blurred, transform-only animation */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(96px);
    will-change: transform;
    z-index: 0;
  }

  /* Primary green — large, anchored top-right, slow drift */
  .blob-1 {
    width: 60vw; height: 60vw;
    background: radial-gradient(circle, #05CE78 0%, #00AB61 60%, transparent 100%);
    top: -20vw; right: -16vw;
    opacity: 0.40;
    animation: drift-1 28s ease-in-out infinite;
  }

  /* Secondary green — bottom-left, slightly faster */
  .blob-2 {
    width: 44vw; height: 44vw;
    background: radial-gradient(circle, #00D47E 0%, #009E5A 70%, transparent 100%);
    bottom: -18vw; left: -12vw;
    opacity: 0.30;
    animation: drift-2 22s ease-in-out infinite;
  }

  /* Soft warm accent — center, very slow, ties champagne to green */
  .blob-3 {
    width: 34vw; height: 34vw;
    background: radial-gradient(circle, #7FEFBC 0%, #05CE78 55%, transparent 100%);
    top: 35%; left: 36%;
    opacity: 0.16;
    animation: drift-3 35s ease-in-out infinite;
  }

  /* Ghost blob — barely visible, gives depth to bottom-right */
  .blob-4 {
    width: 28vw; height: 28vw;
    background: radial-gradient(circle, #C8F7E2 0%, transparent 70%);
    bottom: 5%; right: 8%;
    opacity: 0.22;
    animation: drift-1 40s ease-in-out infinite reverse;
  }

  /* Small travel distances keep it calm — blobs barely move,
     but because they're enormous the shift reads as flowing color */
  @keyframes drift-1 {
    0%, 100% { transform: translate(0,    0)    scale(1);    }
    33%       { transform: translate(-3vw, 4vw)  scale(1.06); }
    66%       { transform: translate(2vw,  -3vw) scale(0.97); }
  }
  @keyframes drift-2 {
    0%, 100% { transform: translate(0,    0)   scale(1);    }
    40%      { transform: translate(4vw,  -3vw) scale(1.08); }
    80%      { transform: translate(-2vw, 2vw)  scale(0.95); }
  }
  @keyframes drift-3 {
    0%, 100% { transform: translate(-50%, -50%) scale(1);    }
    50%      { transform: translate(-44%, -56%) scale(1.14); }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
  }

  /* ─── Layout ──────────────────────────────────────────────────── */
  .shell {
    position: relative;
    z-index: 2;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: clamp(16px, 4vmin, 44px) var(--margin);
  }

  /* ─── Nav ─────────────────────────────────────────────────────── */
  .nav {
    display: flex;
    align-items: center;
    gap: 14px;
    width: fit-content;
    padding: 10px 20px 10px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.90);
    background: rgba(255,255,255,.65);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: 0 8px 32px -8px rgba(20,13,138,.10),
                0 1px 0 rgba(255,255,255,.95) inset;
    animation: fade-up 0.7s var(--ease-out) both;
  }
  .logo-img {
    height: 30px; width: auto; display: block;
    filter: drop-shadow(0 3px 8px rgba(5,206,120,.18));
  }
  .divider { width: 1px; height: 18px; background: rgba(20,13,138,.14); }
  .nav-sub {
    font-family: 'JetBrains Mono';
    font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--navy); opacity: .55; font-weight: 500;
  }

  /* ─── Hero ────────────────────────────────────────────────────── */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 780px;
    gap: 36px;
  }

  .farewell {
    font-family: 'Manrope', system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(28px, 3.8vw, 56px);
    letter-spacing: -0.04em;
    line-height: 1.12;
    /* Static gradient — shimmer is too busy for a calm farewell */
    background: linear-gradient(108deg, #009650 0%, #05CE78 50%, #007840 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: fade-up 0.9s var(--ease-out) 0.1s both;
  }

  .wave {
    display: inline-block;
    font-style: normal;
    /* Single wave at start, then stops — it's a farewell, not a loop */
    animation: wave 1.8s var(--ease-out) 0.8s both;
    transform-origin: 70% 70%;
  }
  @keyframes wave {
    0%   { transform: rotate(0deg);   }
    20%  { transform: rotate(22deg);  }
    45%  { transform: rotate(-10deg); }
    65%  { transform: rotate(18deg);  }
    85%  { transform: rotate(-4deg);  }
    100% { transform: rotate(0deg);   }
  }

  /* ─── Button ──────────────────────────────────────────────────── */
  .btn-wrap { animation: fade-up 0.9s var(--ease-out) 0.3s both; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 14px 22px 14px 26px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    background: var(--green-1);
    color: #fff;
    font-family: 'Manrope', system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(13px, 1.1vw, 15px);
    letter-spacing: -0.01em;
    box-shadow: 0 10px 32px -6px rgba(5,206,120,.50),
                0 1px 0 rgba(255,255,255,.22) inset;
    /* Specify exact properties — never transition: all */
    transition: background 250ms ease,
                transform   250ms var(--ease-out),
                box-shadow  250ms var(--ease-out);
  }
  @media (hover: hover) and (pointer: fine) {
    .btn:hover {
      background: var(--green-2);
      transform: translateY(-3px);
      box-shadow: 0 18px 44px -8px rgba(5,206,120,.65),
                  0 1px 0 rgba(255,255,255,.28) inset;
    }
    .btn:hover .arr { transform: translateX(3px); }
  }
  /* Active gives immediate press feedback */
  .btn:active { transform: scale(0.97); }

  .arr {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,.20);
    display: grid; place-items: center;
    transition: transform 200ms var(--ease-out);
    flex-shrink: 0;
  }
  .arr svg {
    width: 12px; height: 12px;
    stroke: #fff; fill: none;
    stroke-width: 2.2;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* ─── Shared entry animation ──────────────────────────────────── */
  /* Start from scale(0.98) + opacity(0) — nothing appears from nowhere */
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0)    scale(1);    }
  }
</style>
</head>
